<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="James’s 2024 WRX: separate recorded power peaks, 339.2 hp in March, 371.6 hp in June and 424 hp in the July 2025 comparison. Different hardware and tuning stages, not tune-only gains."><rect width="480" height="300" fill="#09121e"/><image href="/assets/brand/keith-logo.svg" x="300" y="45" width="150" height="150" opacity=".1"/><g font-family="Arial,sans-serif" fill="#f4f7fb"><text x="24" y="34" font-size="18" font-weight="700">James’s 2024 WRX · recorded peaks</text><text x="24" y="78" font-size="16">March 2025</text><text x="450" y="78" text-anchor="end" font-size="18">339.2 hp</text><rect x="24" y="88" width="271.36" height="24" fill="#7f9bb7"/><text x="24" y="145" font-size="16">June 2025</text><text x="450" y="145" text-anchor="end" font-size="18">371.6 hp</text><rect x="24" y="155" width="297.28" height="24" fill="#a7bdd0"/><text x="24" y="212" font-size="16">July 2025 comparison</text><text x="450" y="212" text-anchor="end" font-size="18">424 hp</text><rect x="24" y="222" width="339.2" height="24" fill="#ff9952"/><text x="24" y="281" font-size="14">Separate upgrade stages · zero-based scale to 500 hp</text></g></svg>